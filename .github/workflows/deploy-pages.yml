name: Deploy Toronto Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: toronto-preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated Toronto branch
        uses: actions/checkout@v4
        with:
          repository: JeremyHennessy/TowerSignal
          ref: 371f15074afd0f1f0c9ca5b0c9bbbbbd39a4909d
          path: app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Verify Toronto frontend
        working-directory: app
        env:
          VITE_ENABLE_TORONTO: "true"
          VITE_TORONTO_PREVIEW: "true"
        run: |
          npm run lint
          npm run typecheck
          npm exec vitest run -- tests/frontend/TorontoMarket.test.tsx

      - name: Build isolated Pages artifact
        working-directory: app
        env:
          VITE_ENABLE_TORONTO: "true"
          VITE_TORONTO_PREVIEW: "true"
        run: npm exec vite build -- --base=/TowerSignal-Toronto-Preview/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
