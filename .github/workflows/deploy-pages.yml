name: Deploy Toronto Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: toronto-preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact verified Toronto release candidate
        uses: actions/checkout@v4
        with:
          repository: JeremyHennessy/TowerSignal
          ref: a535195e32eb2be7397eafd709ec0eba013e6890
          path: app

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Run identity and ChemTRAC regressions
        working-directory: app
        run: |
          python -m unittest \
            tests.python.test_toronto_source_identity_regression \
            tests.python.test_toronto_identity_exceptions \
            tests.python.test_toronto_chemtrac_regression -v

      - name: Build normalized Toronto app payload
        working-directory: app
        run: python scripts/build_toronto_app_data.py

      - name: Validate source actions in strict mode
        working-directory: app
        run: python scripts/validate_toronto_source_actions.py --strict --record-sample-size 5

      - name: Audit Toronto source semantics in strict mode
        working-directory: app
        run: python scripts/audit_toronto_source_semantics.py --strict

      - name: Prove public-notice cardinality
        working-directory: app
        run: python scripts/audit_toronto_public_notice_cardinality.py

      - name: Prove source-row resolution in strict mode
        working-directory: app
        run: python scripts/audit_toronto_source_row_resolution.py --strict

      - name: Validate Toronto market and evidence contract
        working-directory: app
        run: |
          python scripts/validate_toronto_market.py
          python scripts/toronto_final_validate.py

      - name: Verify Toronto frontend
        working-directory: app
        env:
          VITE_ENABLE_TORONTO: "true"
          VITE_TORONTO_PREVIEW: "true"
        run: |
          npm run lint
          npm run typecheck
          npm exec vitest run -- tests/frontend/TorontoMarket.test.tsx

      - name: Build isolated Pages artifact
        working-directory: app
        env:
          VITE_ENABLE_TORONTO: "true"
          VITE_TORONTO_PREVIEW: "true"
        run: npm exec vite build -- --base=/TowerSignal-Toronto-Preview/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
