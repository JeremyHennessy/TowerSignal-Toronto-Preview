name: Toronto Preview UI Audit

on:
  push:
    branches:
      - agent/ui-link-audit-20260904
    paths:
      - ".github/workflows/ui-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Toronto navigation candidate
        uses: actions/checkout@v4
        with:
          repository: JeremyHennessy/TowerSignal
          ref: 01b70d072088aac88aeff209e7cbd5214e11b951
          path: app

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Build Toronto preview candidate
        working-directory: app
        env:
          VITE_ENABLE_TORONTO: "true"
          VITE_TORONTO_PREVIEW: "true"
        run: npm exec vite build -- --base=/TowerSignal-Toronto-Preview/

      - name: Apply preview-only route guard
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('dist/index.html')
          html = path.read_text(encoding='utf-8')
          guard = """<script>(function(){var h=window.location.hash||'';if(!h.startsWith('#/toronto')){window.location.replace(window.location.pathname+window.location.search+'#/toronto');}})();</script>"""
          if guard not in html:
              html = html.replace('<head>', '<head>'+guard, 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Verify New York app target
        run: curl -L --fail --silent --show-error --max-time 30 -o /dev/null https://jeremyhennessy.github.io/TowerSignal/

      - name: Capture screenshots and route evidence
        working-directory: app
        run: |
          rm -rf /tmp/toronto-preview-site
          mkdir -p /tmp/toronto-preview-site/TowerSignal-Toronto-Preview
          cp -R dist/. /tmp/toronto-preview-site/TowerSignal-Toronto-Preview/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/toronto-preview-site > /tmp/toronto-preview-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/TowerSignal-Toronto-Preview/ >/dev/null; then break; fi
            sleep 1
          done
          cat > audit.mjs <<'EOF'
          import { chromium } from '@playwright/test'
          import fs from 'node:fs'
          const out = 'ui-audit'
          fs.mkdirSync(out, { recursive: true })
          const browser = await chromium.launch()
          const results = []
          async function record(page, name) {
            await page.waitForTimeout(500)
            await page.screenshot({ path: `${out}/${name}.png`, fullPage: true })
            results.push({
              name,
              url: page.url(),
              text: (await page.locator('body').innerText()).slice(0, 12000),
              links: await page.locator('a').evaluateAll(els => els.map(e => ({ text: e.textContent?.trim() || '', href: e.href, target: e.target }))),
              buttons: await page.locator('button').evaluateAll(els => els.map(e => e.textContent?.trim() || '').filter(Boolean)),
            })
          }
          async function openAndRecord(name, viewport, url) {
            const page = await browser.newPage({ viewport })
            const badResponses = []
            const failedRequests = []
            page.on('response', response => { if (response.status() >= 400) badResponses.push({ url: response.url(), status: response.status() }) })
            page.on('requestfailed', request => failedRequests.push({ url: request.url(), failure: request.failure() }))
            await page.goto(url, { waitUntil: 'networkidle' })
            await page.getByRole('heading', { name: 'Toronto Market' }).waitFor({ timeout: 15000 })
            const forbidden = ['Home','Prospect','Monitor','Map','NYS Market','NYS Changes','Opportunities','Companies','Portfolios','Workflow']
            for (const label of forbidden) {
              if (await page.getByRole('button', { name: label, exact: true }).count()) throw new Error(`Unavailable preview navigation is still exposed: ${label}`)
            }
            if (await page.getByLabel('Market', { exact: true }).count()) throw new Error('Unavailable market selector is still exposed')
            if (await page.getByLabel('Search accounts or locations', { exact: true }).count()) throw new Error('NYC global search is still exposed')
            if (await page.getByLabel('Source Health & Coverage', { exact: true }).count()) throw new Error('NYC source health is still exposed')
            if (await page.getByLabel('Open TowerSignal account', { exact: true }).count()) throw new Error('Unavailable account portal is still exposed')
            const nyLink = page.getByRole('link', { name: 'New York app ↗', exact: true })
            if (await nyLink.getAttribute('href') !== 'https://jeremyhennessy.github.io/TowerSignal/') throw new Error('New York app link target is incorrect')
            await record(page, name)
            results[results.length - 1].badResponses = badResponses
            results[results.length - 1].failedRequests = failedRequests
            await page.close()
          }
          const base = 'http://127.0.0.1:4173/TowerSignal-Toronto-Preview/'
          await openAndRecord('after-toronto-desktop', { width: 1440, height: 1000 }, `${base}#/toronto`)
          await openAndRecord('after-toronto-iphone', { width: 390, height: 844 }, `${base}#/toronto`)
          await openAndRecord('after-bare-root', { width: 1440, height: 1000 }, base)
          await openAndRecord('after-legacy-prospect', { width: 1440, height: 1000 }, `${base}#/prospect`)
          fs.writeFileSync(`${out}/audit.json`, JSON.stringify(results, null, 2))
          await browser.close()
          EOF
          node audit.mjs

      - name: Upload UI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toronto-preview-ui-audit-after
          path: app/ui-audit
          if-no-files-found: error
